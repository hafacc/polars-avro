[package]
name = "polars-avro"
version = "0.1.0"
license = "MIT"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[features]
deflate = ["arrow-avro/deflate"]
snappy = ["arrow-avro/snappy"]
bzip2 = ["arrow-avro/bzip2"]
xz = ["arrow-avro/xz"]
zstd = ["arrow-avro/zstd"]
pyo3 = [
    "dep:pyo3",
    "arrow/ffi",
    "deflate",
    "snappy",
    "bzip2",
    "xz",
    "zstd",
]

[dependencies]
arrow = { version = "60.1", default-features = false }
arrow-avro = { version = "59.0", default-features = false }
pyo3 = { version = "0.29", optional = true, features = ["abi3-py310"] }

[dev-dependencies]
apache-avro = "0.22.0"
uuid = "1.26.1"
